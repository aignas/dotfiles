# Settings for the multi-user nix daemon, which ignores them in the user's
# nix.conf unless the user is trusted. Install them next to the existing
# /etc/nix/nix.conf, which only gains an include line, and restart the daemon:
#
#   sudo install -m 644 ~/.dotfiles/script/nix-system.conf /etc/nix/dotfiles.conf
#   grep -qxF '!include dotfiles.conf' /etc/nix/nix.conf ||
#       echo '!include dotfiles.conf' | sudo tee -a /etc/nix/nix.conf
#   sudo systemctl restart nix-daemon
#
# The file is copied rather than linked, so that changing the trusted caches
# and keys still needs root. Rerun the install line after changing it.

# Deduplicate identical files in the store and do not keep build inputs around
# after the packages have been built.
auto-optimise-store = true
keep-derivations = false

# Prefer binaries from the caches so that fewer derivations have to be built
# locally in the first place.
extra-substituters = https://nix-community.cachix.org/
extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
